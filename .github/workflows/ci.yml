name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app
      - run: python -m json.tool frontend/manifest.json >/dev/null
      - run: PYTHONPATH=. pytest -q backend/tests